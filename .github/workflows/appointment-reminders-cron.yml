name: Appointment reminders cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  process-due-reminders:
    name: Process due appointment reminders
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder processing endpoint
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://agensync-backend-jaunty-coral-5888.fly.dev/api/cron/appointment-reminders/process-due"
